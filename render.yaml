services:
  - type: web
    name: pixel2edit
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && pip install gunicorn
    startCommand: python -m gunicorn "app:app" --bind 0.0.0.0:$PORT --workers 2 --timeout 120 || python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: FLASK_DEBUG
        value: "False"
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
